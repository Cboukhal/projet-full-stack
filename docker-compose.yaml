services:
  db:
    image: postgres:17-alpine
    container_name: formanova-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-formanova}
      POSTGRES_USER: ${POSTGRES_USER:-formanova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-formanova_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-formanova} -d ${POSTGRES_DB:-formanova}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: formanova-mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8025/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: formanova-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_CORS_ALLOWED_ORIGINS: "${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,http://frontend:5173}"
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: mailhog
      EMAIL_PORT: 1025
      EMAIL_USE_TLS: "0"
      EMAIL_USE_SSL: "0"
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@formanova.local}
      # URL placée dans le lien de réinitialisation envoyé par MailHog.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      PASSWORD_RESET_TOKEN_TTL_SECONDS: ${PASSWORD_RESET_TOKEN_TTL_SECONDS:-3600}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: front-page/formanova-front/Dockerfile
    container_name: formanova-frontend
    restart: unless-stopped
    environment:
      # Ce code s'exécute dans le navigateur de l'hôte, pas dans le réseau
      # Docker : il doit donc utiliser une adresse joignable depuis l'hôte.
      VITE_BACKEND_URL: http://localhost:8000
    volumes:
      - ./front-page/formanova-front:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_node_modules:
